<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="3m-build-marker" content="public-content-restore-2026-08-28" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f8fafc" />
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #f8fafc; }

    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Google Analytics 4 — propriété 3M Travel & Services -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4HBHHH37VL"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-4HBHHH37VL');
    </script>
    <script>
      window.addEventListener('load', () => {
        const isPreviewHost = /\.manus\.computer$|\.manuspre\.computer$|\.manuscomputer\.ai$/i.test(window.location.hostname);
        if (isPreviewHost) {
          Promise.all([
            navigator.serviceWorker.getRegistrations().then(registrations => Promise.all(registrations.map(registration => registration.unregister()))),
            caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key)))),
          ]).catch(() => {});
          return;
        }
        const swRevision = '2026-08-28-protected-route-network-only';
        navigator.serviceWorker.register('/sw.js?revision=' + swRevision, { updateViaCache: 'none' }).then(registration => {
          registration.update();
          const activateWaitingWorker = () => {
            if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
          };
          activateWaitingWorker();
          registration.addEventListener('updatefound', () => {
            const worker = registration.installing;
            if (!worker) return;
            worker.addEventListener('statechange', () => {
              if (worker.state === 'installed') activateWaitingWorker();
            });
          });
        }).catch(() => {});
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          const reloadKey = '3m_pwa_controller_reloaded';
          if (!sessionStorage.getItem(reloadKey)) {
            sessionStorage.setItem(reloadKey, '1');
            window.location.reload();
          }
        });
      });
    </script>
  </head>
  <body>
    <script>
      (() => {
        const legacyHosts = { '3mtravelagency.click': true, 'www.3mtravelagency.click': true };
        if (legacyHosts[window.location.hostname]) {
          window.location.replace('https://www.3mtravelagency.com' + window.location.pathname + window.location.search + window.location.hash);
        }
      })();
    </script>
    <div id="root"><!--prerender-app--></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
