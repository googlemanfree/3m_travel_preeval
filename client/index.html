    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #eef5ff; }
      .boot-fallback { min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #12315d; font-family: Inter, system-ui, sans-serif; }
      .boot-fallback__content { display: grid; justify-items: center; gap: 12px; text-align: center; }
      .boot-fallback__spinner { width: 36px; height: 36px; border: 4px solid rgba(37, 99, 235, .18); border-top-color: #2563eb; border-radius: 999px; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-fallback__spinner { animation: none; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root">
      <div class="boot-fallback" role="status" aria-live="polite">
        <div class="boot-fallback__content">
          <strong>3M Travel &amp; Services</strong>
          <span class="boot-fallback__spinner" aria-hidden="true"></span>
          <span>Chargement de la page…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script
