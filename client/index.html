    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Les domaines de prévisualisation Manus reposent déjà sur un serveur
          // de développement. Ne pas y conserver de service worker : un ancien
          // cache peut réinjecter /@vite/client et déclencher un faux échec HMR.
          const isPreviewHost = /\.manus\.computer$|\.manuspre\.computer$|\.manuscomputer\.ai$/i.test(window.location.hostname);
          if (isPreviewHost) {
            Promise.all([
              navigator.serviceWorker.getRegistrations().then(registrations => Promise.all(registrations.map(registration => registration.unregister()))),
              caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key)))),
            ]).catch(() => {
              // Le mode prévisualisation reste fonctionnel même si le nettoyage échoue.
            });
            return;
          }

          const SW_REVISION = '2026-08-26-status-and-form-feedback-static';
          navigator.serviceWorker.register('/sw.js?revision=' + SW_REVISION, { updateViaCache: 'none' }).then(registration => {
            // Toujours rechercher une nouvelle version après un déploiement :
            // cela évite qu’une ancienne page ou un ancien bundle reste affiché.
            registration.update();
            const activateWaitingWorker = () => {
              if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            };
            activateWaitingWorker();
            registration.addEventListener('updatefound', () => {
              const worker = registration.installing;
              if (!worker) return;
              worker.addEventListener('statechange', () => {
                if (worker.state === 'installed') activateWaitingWorker();
              });
            });
          }).catch(err => {
            console.log('SW registration failed: ', err);
          });

          navigator.serviceWorker.addEventListener('controllerchange', () => {
            const reloadKey = '3m_pwa_controller_reloaded';
            if (!sessionStorage.getItem(reloadKey)) {
              sessionStorage.setItem(reloadKey, '1');
              window.location.reload();
            }
          });
        });
      }
    </script>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }

      .boot-fallback { min-height: 100vh; display: grid; place-items: center; box-sizing: border-box; padding: 24px; color: #f8fbff; font-family: Inter, system-ui, sans-serif; background: radial-gradient(circle at 50% 28%, rgba(24, 82, 154, .32), transparent 38%), linear-gradient(145deg, #06152f 0%, #0b2f6f 62%, #071b3d 100%); }
      .boot-fallback__content { display: grid; justify-items: center; gap: 14px; width: min(100%, 360px); text-align: center; }
      .boot-fallback__brand { display: grid; place-items: center; width: 64px; height: 64px; border: 1px solid rgba(244, 185, 66, .55); border-radius: 20px; color: #fff5cf; font-size: 20px; font-weight: 800; letter-spacing: .06em; box-shadow: 0 12px 40px rgba(0, 0, 0, .24); }
      .boot-fallback__title { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .02em; }
      .boot-fallback__subtitle { margin: 0; color: #c9d9f2; font-size: 13px; }

      .boot-fallback__retry { margin-top: 4px; padding: 10px 20px; border: 1px solid rgba(244, 185, 66, .7); border-radius: 10px; background: #f4b942; color: #071b3d; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
      .boot-fallback__retry:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
      .boot-fallback__contact { margin-top: 2px; color: #d9e8ff; font-size: 13px; text-underline-offset: 3px; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-fallback__spinner { animation: none; } }
    </style>

  <body>
    <script>
      (function () {
        var legacyHosts = { "3mtravelagency.click": true, "www.3mtravelagency.click": true };
        if (legacyHosts[window.location.hostname]) {
          window.location.replace("https://www.3mtravelagency.com" + window.location.pathname + window.location.search + window.location.hash);
        }
      })();
    </script>
    <div id="root">
      <div class="boot-fallback" role="status" aria-live="polite">
        <div class="boot-fallback__content">
          <span class="boot-fallback__brand" aria-hidden="true">3M</span>
          <p class="boot-fallback__title">3M Travel &amp; Services</p>
          <p class="boot-fallback__subtitle">Préparation de votre espace sécurisé…</p>
          <span class="boot-fallback__spinner" aria-hidden="true"></span>
          <span>Chargement en cours</span>
        </div>
      </div>
    </div>
    <script>
      // Filet de sécurité indépendant de React : si l'application n'a pas
      // démarré (fichier principal qui échoue à charger, réseau coupé,
      // cache périmé après un redéploiement) dans les 15 secondes, ce
      // script pur JavaScript remplace l'écran de secours par un message
      // et un bouton de rechargement — sans dépendre de React, puisque
      // React est justement ce qui n'a peut-être jamais démarré.
      (function () {
        var BOOT_TIMEOUT_MS = 15000;
        var RELOAD_FLAG_KEY = "3m_boot_timeout_reload_attempted";

        window.setTimeout(function () {
          var root = document.getElementById("root");
          if (!root) return;
          // Si React a déjà remplacé le contenu, ce div n'existe plus.
          var stillBooting = root.querySelector(".boot-fallback");
          if (!stillBooting) return;

          var alreadyAttempted = sessionStorage.getItem(RELOAD_FLAG_KEY);
          if (!alreadyAttempted) {
            sessionStorage.setItem(RELOAD_FLAG_KEY, "1");
            window.location.reload();
            return;
          }

          // Déjà retenté une fois sans succès — on affiche un message
          // clair avec un bouton, plutôt que de recharger indéfiniment.
          root.innerHTML =
            '<div class="boot-fallback" role="alert">' +
              '<div class="boot-fallback__content">' +
                '<span class="boot-fallback__brand" aria-hidden="true">3M</span>' +
                '<p class="boot-fallback__title">3M Travel &amp; Services</p>' +
                '<p class="boot-fallback__subtitle">Le chargement rencontre un problème persistant.</p>' +
                '<button class="boot-fallback__retry" onclick="sessionStorage.removeItem(\'' + RELOAD_FLAG_KEY + '\'); window.location.reload();">' +
                  'Réessayer' +
                '</button>' +
                '<a class="boot-fallback__contact" href="https://wa.me/237698104832">Contacter l\'agence sur WhatsApp</a>' +
              '</div>' +
            '</div>';
        }, BOOT_TIMEOUT_MS);
      })();
    </script>
