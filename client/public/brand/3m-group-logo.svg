<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">3M GROUP SARL</title>
  <desc id="desc">Logo multi-services: mobilite, voyage, etudes, travail, assurance, traduction</desc>
  <rect width="1100" height="560" fill="#FFFFFF"/>

  <!-- Wordmark -->
  <text x="36" y="250" fill="#0B2A52" font-family="Arial Black, Impact, sans-serif" font-size="150" font-weight="900" letter-spacing="-4">3M</text>
  <text x="42" y="328" fill="#0B2A52" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" letter-spacing="10">GROUP</text>
  <text x="300" y="368" fill="#0B2A52" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="5">SARL</text>

  <!-- Emblem -->
  <g transform="translate(520 36)">
    <!-- Outer rings -->
    <circle cx="210" cy="210" r="198" fill="none" stroke="#0B2A52" stroke-width="8"/>
    <circle cx="210" cy="210" r="186" fill="none" stroke="#D8A928" stroke-width="3"/>
    <circle cx="210" cy="210" r="172" fill="none" stroke="#0B2A52" stroke-width="2" stroke-dasharray="8 10"/>

    <!-- Globe -->
    <circle cx="210" cy="210" r="92" fill="none" stroke="#0B2A52" stroke-width="7"/>
    <ellipse cx="210" cy="210" rx="38" ry="92" fill="none" stroke="#0B2A52" stroke-width="4.5"/>
    <path d="M128 180h164M128 240h164" fill="none" stroke="#0B2A52" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M140 150c30 14 110 14 140 0M140 270c30-14 110-14 140 0" fill="none" stroke="#0B2A52" stroke-width="3.2" stroke-linecap="round" opacity="0.85"/>

    <!-- Three arrows -->
    <path d="M150 300 C180 230 220 180 270 145" fill="none" stroke="#0B2A52" stroke-width="13" stroke-linecap="round"/>
    <path d="M252 124 L292 142 L264 176 Z" fill="#0B2A52"/>
    <path d="M190 312 C230 228 285 175 340 140" fill="none" stroke="#D8A928" stroke-width="15" stroke-linecap="round"/>
    <path d="M320 116 L368 134 L336 174 Z" fill="#D8A928"/>
    <path d="M230 318 C275 245 335 200 385 170" fill="none" stroke="#0B2A52" stroke-width="11" stroke-linecap="round"/>
    <path d="M368 150 L408 168 L382 198 Z" fill="#0B2A52"/>

    <!-- Service nodes on orbit (6 volets) -->
    <!-- 1 plane top -->
    <g transform="translate(210 28)">
      <circle r="22" fill="#FFFFFF" stroke="#D8A928" stroke-width="3"/>
      <path d="M-12 2 L12 -2 L4 6 L10 10 L2 8 L-2 14 Z" fill="#0B2A52"/>
    </g>
    <!-- 2 passport / visa top-right -->
    <g transform="translate(348 90)">
      <circle r="22" fill="#FFFFFF" stroke="#0B2A52" stroke-width="3"/>
      <rect x="-9" y="-11" width="18" height="22" rx="2" fill="none" stroke="#0B2A52" stroke-width="2.2"/>
      <circle cx="0" cy="-2" r="3.5" fill="none" stroke="#D8A928" stroke-width="1.8"/>
      <path d="M-5 6h10M-4 10h8" stroke="#0B2A52" stroke-width="1.6"/>
    </g>
    <!-- 3 shield insurance right -->
    <g transform="translate(392 210)">
      <circle r="22" fill="#FFFFFF" stroke="#D8A928" stroke-width="3"/>
      <path d="M0 -12 L10 -6 V2 C10 8 4 13 0 15 C-4 13 -10 8 -10 2 V-6 Z" fill="none" stroke="#0B2A52" stroke-width="2.2"/>
      <path d="M-3 1 L-0.5 4 L5 -3" fill="none" stroke="#D8A928" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- 4 hotel bottom-right -->
    <g transform="translate(348 330)">
      <circle r="22" fill="#FFFFFF" stroke="#0B2A52" stroke-width="3"/>
      <rect x="-8" y="-6" width="16" height="14" fill="none" stroke="#0B2A52" stroke-width="2"/>
      <path d="M-10 -6 L0 -13 L10 -6" fill="none" stroke="#D8A928" stroke-width="2" stroke-linejoin="round"/>
      <rect x="-2" y="2" width="4" height="6" fill="#0B2A52"/>
    </g>
    <!-- 5 graduation / etudes bottom-left -->
    <g transform="translate(72 330)">
      <circle r="22" fill="#FFFFFF" stroke="#D8A928" stroke-width="3"/>
      <path d="M-11 0 L0 -7 L11 0 L0 7 Z" fill="none" stroke="#0B2A52" stroke-width="2"/>
      <path d="M-7 2 V8 L0 11 L7 8 V2" fill="none" stroke="#0B2A52" stroke-width="1.8"/>
      <circle cx="9" cy="1" r="1.6" fill="#D8A928"/>
    </g>
    <!-- 6 briefcase / travail left -->
    <g transform="translate(28 210)">
      <circle r="22" fill="#FFFFFF" stroke="#0B2A52" stroke-width="3"/>
      <rect x="-9" y="-4" width="18" height="12" rx="1.5" fill="none" stroke="#0B2A52" stroke-width="2"/>
      <path d="M-4 -4 V-8 H4 V-4" fill="none" stroke="#D8A928" stroke-width="2"/>
      <path d="M-9 1 H9" stroke="#0B2A52" stroke-width="1.6"/>
    </g>
  </g>

  <!-- Gold rule + multi-service tagline -->
  <line x1="42" y1="420" x2="1058" y2="420" stroke="#D8A928" stroke-width="3"/>
  <text x="550" y="468" text-anchor="middle" fill="#0B2A52" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="6">ETUDES  ·  TRAVAIL  ·  VOYAGE  ·  SERVICES</text>
  <text x="550" y="508" text-anchor="middle" fill="#5A6B80" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" letter-spacing="3">VISA  ·  VOLS  ·  HOTELS  ·  ASSURANCE  ·  TRADUCTION</text>
</svg>
