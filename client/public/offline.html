<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f2747" />
    <title>3M TRAVEL AGENCY — Hors connexion</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #eef4f8; color: #102a43; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 10%, #fff 0 14%, transparent 40%), linear-gradient(145deg, #e8f0f6, #f8fbfd); }
      main { width: min(100%, 560px); padding: 40px 28px; text-align: center; background: rgba(255,255,255,.92); border: 1px solid #d7e2ec; border-radius: 28px; box-shadow: 0 24px 70px rgba(15,39,71,.14); }
      img { width: 92px; height: 92px; object-fit: contain; margin: 0 auto 22px; border-radius: 999px; background: #fff; box-shadow: 0 8px 24px rgba(15,39,71,.16); }
      h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.1; letter-spacing: -.03em; }
      p { margin: 16px auto 0; max-width: 420px; color: #52677a; line-height: 1.65; }
      .status { display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; padding: 9px 13px; border-radius: 999px; background: #fff7df; color: #8a5a00; font-size: .82rem; font-weight: 700; }
      .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #d99000; }
      button { margin-top: 28px; border: 0; border-radius: 12px; padding: 12px 18px; background: #0f4c81; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
      button:hover { background: #0b3a63; }
      button:focus-visible { outline: 3px solid #f0b429; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <main aria-labelledby="offline-title">
      <img src="/logo-3m.webp" alt="Logo 3M TRAVEL AGENCY" />
      <h1 id="offline-title">Vous êtes hors connexion</h1>
      <p>Les pages déjà consultées restent disponibles. Reconnectez-vous pour actualiser vos procédures, vos messages et votre espace client.</p>
      <span class="status" role="status">Mode hors ligne</span>
      <br />
      <button type="button" onclick="window.location.reload()">Réessayer</button>
    </main>
  </body>
</html>
