# Railway deployment configuration for 3M Travel & Services
# Secrets and environment-specific values must be configured in Railway Variables.

[build]
builder = "RAILPACK"
buildCommand = "pnpm install --frozen-lockfile && pnpm run build"

[deploy]
startCommand = "pnpm start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
