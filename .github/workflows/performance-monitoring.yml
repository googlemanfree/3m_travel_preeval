name: Performance Monitoring

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Lundi à 9h UTC
    - cron: '0 9 * * 1'

jobs:
  performance:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Analyze CSS/JS
        run: |
          node scripts/optimize-css-js.mjs --report > css-js-report.json
          cat css-js-report.json
      
      - name: Analyze Bundle
        run: |
          node scripts/analyze-bundle.mjs > bundle-report.json
          cat bundle-report.json
      
      - name: Check Bundle Size
        run: |
          BUNDLE_SIZE=$(du -sb dist/ | cut -f1)
          MAX_SIZE=$((200 * 1024))
          
          if [ $BUNDLE_SIZE -gt $MAX_SIZE ]; then
            echo "❌ Bundle trop volumineux: $(($BUNDLE_SIZE / 1024))KB (max: 200KB)"
            exit 1
          fi
          
          echo "✅ Bundle OK: $(($BUNDLE_SIZE / 1024))KB"
      
      - name: Check for dead code
        run: |
          CONSOLE_LOGS=$(grep -r "console\." client/src --include="*.tsx" | wc -l)
          DEBUGGERS=$(grep -r "debugger" client/src --include="*.tsx" | wc -l)
          TODOS=$(grep -r "TODO\|FIXME" client/src --include="*.tsx" | wc -l)
          
          echo "Code mort détecté:"
          echo "  console.log: $CONSOLE_LOGS"
          echo "  debugger: $DEBUGGERS"
          echo "  TODO/FIXME: $TODOS"
          
          if [ $CONSOLE_LOGS -gt 0 ] || [ $DEBUGGERS -gt 0 ]; then
            echo "⚠️  Code mort détecté"
          fi
      
      - name: Run tests
        run: npm test -- --run
      
      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: performance-reports
          path: |
            css-js-report.json
            bundle-report.json
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            try {
              const cssJsReport = JSON.parse(fs.readFileSync('css-js-report.json', 'utf8'));
              const bundleReport = JSON.parse(fs.readFileSync('bundle-report.json', 'utf8'));
              
              const comment = `
## 📊 Performance Report

### CSS & JavaScript
- **CSS Total:** ${(cssJsReport.css.totalSize / 1024).toFixed(2)} KB
- **JS Total:** ${(cssJsReport.javascript.totalSize / 1024).toFixed(2)} KB
- **CSS Savings:** ${(cssJsReport.css.estimatedSavings / 1024).toFixed(2)} KB
- **JS Savings:** ${(cssJsReport.javascript.estimatedSavings / 1024).toFixed(2)} KB

### Bundle Analysis
- **Dependencies:** ${bundleReport.dependencies}
- **Dev Dependencies:** ${bundleReport.devDependencies}

### Recommendations
${bundleReport.recommendations.map(r => `- ${r}`).join('\n')}

---
*Generated by Performance Monitoring Workflow*
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.error('Error creating comment:', error);
            }
      
      - name: Create performance summary
        if: always()
        run: |
          cat > performance-summary.md << 'EOF'
          # Performance Summary
          
          ## Build Information
          - Build Date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - Branch: ${{ github.ref }}
          - Commit: ${{ github.sha }}
          
          ## Bundle Size
          - Total: $(du -sh dist/ | cut -f1)
          - JS: $(find dist -name "*.js" -exec du -sb {} + | awk '{sum+=$1} END {print sum/1024 " KB"}')
          - CSS: $(find dist -name "*.css" -exec du -sb {} + | awk '{sum+=$1} END {print sum/1024 " KB"}')
          
          ## Status
          - ✅ Build successful
          - ✅ Tests passed
          - ✅ Bundle size OK
          EOF
          
          cat performance-summary.md
      
      - name: Upload performance summary
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: performance-summary
          path: performance-summary.md

  lighthouse:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v9
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate
      
      - name: Check for vulnerabilities
        run: |
          npm audit --json > audit-report.json || true
          cat audit-report.json
      
      - name: Upload audit report
        uses: actions/upload-artifact@v3
        with:
          name: audit-report
          path: audit-report.json
